name: Hermetic E2E - Kimi and Z.AI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/unattended-kimi-zai
    paths:
      - '.github/workflows/hermetic-e2e.yml'
      - 'scripts/hermetic_e2e.py'
      - 'core/base_identity.py'
      - 'core/base_captcha.py'
      - 'core/base_sms.py'
      - 'core/registration/**'
      - 'platforms/kimi/**'
      - 'platforms/zai/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermetic-e2e-kimi-zai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hermetic-e2e:
    name: Hermetic registration closed loop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCOUNT_MANAGER_DATABASE_URL: sqlite:////tmp/any-auto-register-hermetic-e2e.db
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium and Xvfb
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run hermetic unattended registration gate
        run: xvfb-run -a python scripts/hermetic_e2e.py

      - name: Show sanitized gate result
        if: always()
        run: |
          if [[ -f artifacts/hermetic-e2e-result.json ]]; then
            cat artifacts/hermetic-e2e-result.json
          else
            echo '{"ok":false,"error":"hermetic E2E did not produce result artifact"}'
          fi

      - name: Upload sanitized E2E result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermetic-e2e-result
          path: artifacts/hermetic-e2e-result.json
          if-no-files-found: error
          retention-days: 7
